<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Start Overlay */
        #overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer;
            text-align: center;
        }

        .play-btn {
            width: 70px; height: 70px;
            background: #ffcc00;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            margin-bottom: 20px;
        }

        /* Video Wrapper - Adjusted for Mobile Aspect Ratios */
        #video-wrapper {
            width: 95%; 
            height: 90%;
            display: none; 
            justify-content: center; align-items: center;
        }

        video {
            max-width: 100%; 
            max-height: 100%;
            border-radius: 8px;
        }

        /* Final Screen - Optimized for Text Layout */
        #final-screen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 200;
            padding: 20px;
            box-sizing: border-box;
            justify-content: center; align-items: center;
            flex-direction: column;
        }

        /* Middle-sized responsive text */
        .nepali-pop {
            /* clamp(min, preferred, max) - keeps it medium-small on mobile */
            font-size: clamp(1.5rem, 6vw, 2.8rem); 
            font-weight: 800;
            color: #ffcc00;
            text-align: center;
            line-height: 1.4;
            max-width: 600px;
            text-shadow: 3px 3px 0px #ff0000, 5px 5px 0px #550000;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="startExperience()">
        <div class="play-btn">
            <svg width="35" height="35" viewBox="0 0 24 24" fill="black">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </div>
        <p style="color: white; font-weight: bold; font-size: 14px; letter-spacing: 2px;">TAP TO VIEW WISH</p>
    </div>

    <div id="video-wrapper">
        <video id="mainVideo" playsinline>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>

    <div id="final-screen">
        <div class="nepali-pop">पुसको जाडोमा के को NEW YEAR? <br> बैशाख सम्म कुर्नु पर्यो नि साथी! ❄️</div>
    </div>

    <script>
        const video = document.getElementById('mainVideo');
        const overlay = document.getElementById('overlay');
        const wrapper = document.getElementById('video-wrapper');
        const finalScreen = document.getElementById('final-screen');

        function startExperience() {
            overlay.style.display = 'none';
            wrapper.style.display = 'flex';
            video.play();
        }

        video.onended = function() {
            wrapper.style.display = 'none';
            finalScreen.style.display = 'flex';
            fireConfetti();
        };

        function fireConfetti() {
            var duration = 4 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 25, spread: 360, ticks: 50, zIndex: 300 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 40 * (timeLeft / duration);
                
                confetti(Object.assign({}, defaults, { 
                    particleCount, 
                    origin: { x: randomInRange(0.1, 0.9), y: Math.random() - 0.2 } 
                }));
                
                confetti({
                    ...defaults,
                    particleCount: 10,
                    origin: { x: 0, y: 0.5 },
                    angle: 0,
                    spread: 60
                });
                confetti({
                    ...defaults,
                    particleCount: 10,
                    origin: { x: 1, y: 0.5 },
                    angle: 180,
                    spread: 60
                });
            }, 300);
        }
    </script>
</body>
</html>
